<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirección a la App Store</title>
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            var userAgent = navigator.userAgent || navigator.vendor || window.opera;
            if (/android/i.test(userAgent)) {
                window.location.href = "https://play.google.com/store/apps/details?id=com.mx.grupomacro.macropay";
            } else if (/iPad|iPhone|iPod/.test(userAgent) && !window.MSStream) {
               https://apps.apple.com/app/com.mx.grupomacro.macropay";
            } else {
                // Redirigir a una página de descarga genérica o mostrar un mensaje
                window.location.href = "https://example.com/download";
            }
        });
    </script>
</head>
<body>
    <h1>Redirigiendo...</h1>
</body>
</html>
