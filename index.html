<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirección a la App</title>
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            var userAgent = navigator.userAgent || navigator.vendor || window.opera;
            var isIOS = /iPad|iPhone|iPod/.test(userAgent) && !window.MSStream;
            var isAndroid = /android/i.test(userAgent);
            var appStoreURL = "https://apps.apple.com/mx/app/macropay/id6463932842";
            var appURL = "macropay://";

            if (isIOS) {
                var start = new Date().getTime();
                window.location.href = appURL;
            } else if (isAndroid) {
                window.location.href = "intent://example.com#Intent;scheme=macropay;package=com.mx.grupomacro.macropay;end";
            } else {
                // Redirigir a una página de descarga genérica o mostrar un mensaje
                window.location.href = appStoreURL;
            }
        });
    </script>
</head>
<body>
    <h1>Redirigiendo...</h1>
</body>
</html>
