<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirección a la App</title>
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            var userAgent = navigator.userAgent || navigator.vendor || window.opera;
            var hasApp = false;

            if (/android/i.test(userAgent)) {
                window.location.href = "intent://example.com#Intent;scheme=macropay;package=com.mx.grupomacro.macropay;end";
                hasApp = true;
            } else if (/iPad|iPhone|iPod/.test(userAgent) && !window.MSStream) {
                var iframe = document.createElement('iframe');
                iframe.style.display = 'none';
                iframe.src = "macropay://";
                document.body.appendChild(iframe);
                hasApp = true;
            }

            setTimeout(function() {
                if (!hasApp) {
                    window.location.href = "https://apps.apple.com/mx/app/macropay/id6463932842";
                }
            }, 2000);
        });
    </script>
</head>
<body>
    <h1>Redirigiendo...</h1>
</body>
</html>
